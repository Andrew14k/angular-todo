<div class="task-manager">
  <h1>Task Manager</h1>

  <form (ngSubmit)="onAddTask()">
    <div>
      <label for="taskTitle">Title:</label>
      <input id="taskTitle" [(ngModel)]="taskTitle" name="title" required />
    </div>
    <div>
      <label for="taskDescription">Description:</label>
      <textarea id="taskDescription" [(ngModel)]="taskDescription" name="description" required></textarea>
    </div>
    <button type="submit">Add Task</button>
  </form>

  <ul>
    <li *ngFor="let task of tasks">
      <span [class.completed]="task.completed">{{ task.title }}: {{ task.description }}</span>
      <button 
        [ngClass]="{ 'complete': task.completed }" 
        (click)="toggleTaskCompletion(task.id)">
        {{ task.completed ? 'Undo' : 'Complete' }}
      </button>
      <button (click)="deleteTask(task.id)">Delete</button>
    </li>
  </ul>
</div>
